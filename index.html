<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido Cashback</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>🍽 Faça seu pedido e ganhe cashback!</h1>

    <form id="pedidoForm">

        <label>Nome completo</label>
        <input
            type="text"
            id="nome"
            required
            placeholder="Digite seu nome completo">

        <label>CPF</label>
        <input
            type="text"
            id="cpf"
            required
            placeholder="00000000000">

        <label>Email</label>
        <input
            type="email"
            id="email"
            required
            placeholder="exemplo@email.com">

        <label>Produto</label>

        <div class="produtos">

            <label class="card">
                <input 
                type="radio"
                name="produto"
                value="Filé à Parmegiana" data-valor="145.00" required >
                <img src="img/file-parmegiana.webp">
                <h3>Filé à Parmegiana</h3>
                <span class="valor">R$145,00</span>
            </label>

            <label class="card">
                <input type="radio" name="produto" value="Picanha" data-valor="155.00">
                <img src="img/picanha.jpg">
                <h3>Picanha</h3>
                <span class="valor">R$155,00</span>
            </label>

            <label class="card">
                <input type="radio" name="produto" value="Pasta Carbonara" data-valor="138.00">
                <img src="img/pasta-carbonara.jpg">
                <h3>Pasta Carbonara</h3>
                <span class="valor">R$138,00</span>
            </label>

            <label class="card">
                <input type="radio" name="produto" value="risoto-camarao" data-valor="132.00">
                <img src="img/risoto-camarao.jpg">
                <h3>Risoto de Camarão</h3>
                <span class="valor">R$132,00</span>
            </label>

        </div>

        <label>Quantidade</label>

        <input
            type="range"
            min="1"
            max="10"
            value="1"
            id="quantidade">

        <p id="valorQuantidade">1 unidade</p>

        <button type="submit">
            Fazer Pedido
        </button>

    </form>

</div>

<script src="script.js"></script>

</body>
</html>
